<!DOCTYPE html>
<!--
  TELEGRAM MINI APP — STANDALONE ENTRY

  This document is deliberately independent from index.html. It boots only
  the Mini App (src/tma.tsx) with no website router, no Redux store, no
  dashboard routes and no service worker, so customers ordering inside
  Telegram never download the marketing site.

  CSP NOTICE: script-src has no 'unsafe-inline'. Every <script> MUST use an
  external src= file. See DEPLOYMENT_GOTCHAS.md §6.

  Entry URL for BotFather: https://<your-host>/tma.html
-->
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Asella Organic</title>

    <!-- Website typography — DM Sans (body), Outfit (display), DM Mono (data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&family=Outfit:wght@700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Telegram WebApp SDK: required, provides window.Telegram.WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/tma.tsx"></script>
  </body>
</html>
