<!DOCTYPE html>
<!--
  CSP NOTICE — READ BEFORE ADDING ANY <script> TAG:
  This site's Content-Security-Policy (set in .htaccess via postbuild.js) has
  NO 'unsafe-inline' in script-src by design. Any inline <script>...</script>
  block will be silently blocked in production even if it works fine locally
  (local dev servers do not enforce the CSP header from .htaccess).

  Rule: every script added to this file MUST use an external file via src=.
  Put the file in frontend/public/ — Vite copies it to dist/ root as-is.
  See DEPLOYMENT_GOTCHAS.md §6 for full details.
-->
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1f10" />
    <title>Asella Organic — Premium Organic Health Products</title>
    <meta name="description" content="Asella Organic offers premium, cold-processed organic health products including Moringa, Black Seed Oil, and Turmeric. Shop our high-quality natural supplements." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Asella Organic" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Open Graph & Twitter Cards -->
    <meta property="og:title" content="Asella Organic — Premium Organic Health Products" />
    <meta property="og:description" content="Premium cold-processed moringa, turmeric, and honey from the Ethiopian highlands." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://asellaorganic.com/" />
    <meta property="og:image" content="https://asellaorganic.com/icons/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts — synchronous but non-blocking paint via display=swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&family=Outfit:wght@700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Material Symbols — deferred so it never blocks first paint -->
    <link
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap"
  rel="stylesheet"
/>


    <!-- Polyfill for older browsers (.at) — external file required by CSP -->
    <script src="/polyfills.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
