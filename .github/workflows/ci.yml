name: CI — Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — Build, Test & Audit
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: asella_test
          MYSQL_USER: asella_user
          MYSQL_PASSWORD: asella_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: asella_user
      DB_PASSWORD: asella_pass
      DB_NAME: asella_test
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_test_secret_not_for_production_use_only_in_ci_environment_64chars_xyz' }}
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck --workspace=backend

      - name: ESLint
        run: npm run lint --workspace=backend

      - name: Build backend
        run: npm run build --workspace=backend

      - name: Enable MySQL migration support
        run: mysql -h 127.0.0.1 -P 3306 -u root -ptestroot -e "SET GLOBAL log_bin_trust_function_creators = 1;"

      - name: Run database migrations
        run: npm run db:migrate --workspace=backend

      - name: Run backend unit tests
        run: npm run test:unit:nodb --workspace=backend

      - name: Run backend integration tests
        run: npm run test:integration --workspace=backend -- --runInBand

      - name: Dependency audit
        run: npm audit --audit-level=high

  frontend:
    name: Frontend — Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck --workspace=frontend

      - name: ESLint
        run: npm run lint --workspace=frontend

      - name: Production build
        run: npm run build --workspace=frontend
        env:
          VITE_API_URL: http://localhost:3001

      - name: Frontend tests
        run: npm test --workspace=frontend

  ci-gate:
    name: CI — All checks passed
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Report successful checks
        run: echo "Backend and frontend quality gates passed for ${{ github.sha }}."
